<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Carousel Test</title>
<style>
:root{--bg:#FFF5F8;--primary:#F0A0C0;--text:#5D4E5F;--card:#FFFBFC;--border:#F0E0EB;--shadow:0 6px 22px rgba(240,160,192,0.18);--radius:20px;}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);padding:20px;}
.banner{border-radius:var(--radius);padding:20px;color:#fff;overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;}
.banner-text{flex:1;min-width:0;}
.banner h2{font-size:20px;font-weight:800;}
.banner p{font-size:13px;opacity:.92;margin-top:4px;}
.banner-carousel{width:90px;height:90px;border-radius:18px;overflow:hidden;flex-shrink:0;margin-left:14px;background:rgba(255,255,255,0.25);box-shadow:0 4px 14px rgba(0,0,0,0.1);}
.bc-track{display:flex;height:100%;transition:transform .4s ease;}
.bc-track img{width:90px;height:90px;object-fit:cover;flex-shrink:0;}
.bc-dots{position:absolute;bottom:5px;left:0;right:0;display:flex;justify-content:center;gap:3px;}
.bc-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.5);transition:all .2s;}
.bc-dot.active{background:#fff;transform:scale(1.2);}
</style>
</head>
<body>
  <h2>Test Page</h2>
  <p>If the carousel below works, the issue is elsewhere in the main file.</p>
  <div class="banner" style="background:linear-gradient(135deg,#F0A0C0,#F5B8D0)">
    <div class="banner-text">
      <h2>今日打卡 · 第 <span id="streakDays">0</span> 天 🔥</h2>
      <p>坚持是最温柔的力量，继续加油～</p>
    </div>
    <div class="banner-carousel" id="homeCarousel">
      <div class="bc-track"></div>
      <div class="bc-dots"></div>
    </div>
  </div>
  <div id="log" style="margin-top:10px;font-size:12px;color:#666;"></div>
<script>
function log(msg){
  document.getElementById('log').innerHTML+=msg+'<br>';
}
log('Script started');

try {
  initHomeCarousel();
  log('initHomeCarousel completed');
} catch(e) {
  log('ERROR: '+e.message);
}

function initHomeCarousel(){
  log('initHomeCarousel called');
  const imgs=[
    "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wAARCABkAGQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxgRQdIzJDByMzQpIVUmJy4RYkQ2OTwdEl8PDhKDJkF7gpLS8vLzBSfo4xdXj+4ckJWJ4ZKjorjUZH/o0RpvSmhEf/2gAMAwEAAhEDEQA/AJSaM0lFWYhaSikoAWikoGgBaaaWmE4oACahZsUMxJqM0AFBpKM0ABpKWkoASikoBoAWkzSUtADCaaBTjTaAP/9k="
  ];
  log('Images array has '+imgs.length+' items');
  log('First img preview: '+imgs[0].substring(0,30)+'...');
  
  const track=document.querySelector('#homeCarousel .bc-track');
  const dotsBox=document.querySelector('#homeCarousel .bc-dots');
  log('track found: '+(track!=null)+', dotsBox found: '+(dotsBox!=null));
  if(!track)return;
  
  track.innerHTML=imgs.map((src,i)=>"<img src=\""+src+"\" alt=\"test"+(i+1)+"\">" ).join('');
  log('track.innerHTML set, children: '+track.children.length);
  dotsBox.innerHTML=imgs.map(function(_,i){return '<div class="bc-dot '+(i===0?'active':'')+'"></div>';}).join('');
  log('All done!');
}
</script>
</body>
</html>
